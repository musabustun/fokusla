<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fokus</title>
    <meta
      name="description"
      content="Fokus — YKS'ye hazırlananlar için ücretsiz, reklamsız ve açık kaynak çalışma takip uygulaması."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e0f0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fokus" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // İlk boyamadan önce kayıtlı modu ve paleti uygula (yanlış tema parlamasını önler).
      // Anahtarlar ve varsayılanlar: src/ui/theme/themeStorage.ts → THEME_STORAGE_KEY,
      // PALETTE_STORAGE_KEY, DEFAULT_THEME_PREFERENCE ('system'); src/ui/tokens.ts → PALETTE_NAMES,
      // DEFAULT_PALETTE ('coffee'). Kayıt yoksa cihazın açık/koyu ayarı ve Kahve paleti.
      var root = document.documentElement
      var pref = null
      var palette = null
      try {
        pref = localStorage.getItem('fokus.theme')
        palette = localStorage.getItem('fokus.palette')
      } catch (e) {}
      var dark =
        pref === 'dark' ||
        (pref !== 'light' &&
          !!window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      var palettes = ['coffee', 'mono', 'strawberry', 'matcha', 'blueberry', 'lemonade']
      root.dataset.theme = dark ? 'dark' : 'light'
      root.dataset.palette = palettes.indexOf(palette) >= 0 ? palette : 'coffee'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
