<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fokus</title>
    <meta
      name="description"
      content="Fokus — YKS'ye hazırlananlar için ücretsiz, reklamsız ve açık kaynak çalışma takip uygulaması."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e0f0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fokus" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // İlk boyamadan önce kayıtlı temayı uygula (yanlış tema parlamasını önler).
      // Anahtar ve varsayılan: src/ui/theme/themeStorage.ts → THEME_STORAGE_KEY,
      // DEFAULT_THEME_PREFERENCE ('dark'). Kayıt yoksa koyu tema.
      var dark = true
      try {
        var pref = localStorage.getItem('fokus.theme')
        if (pref === 'light') dark = false
        else if (pref === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      } catch (e) {}
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
