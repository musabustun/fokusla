# Güvenlik başlıkları. nginx.conf içinde YALNIZCA sunucu düzeyinde dahil edilir (konumlarda add_header yok).
# Site yalnızca kendi dosyalarını kullanır: dış istek, satır içi stil ve betik yoktur.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Yalnızca HTTPS üzerinden gelen yanıtlarda geçerlidir (TLS'i vekil sonlandırır); alt alan adlarını kapsamaz.
add_header Strict-Transport-Security "max-age=15552000" always;
