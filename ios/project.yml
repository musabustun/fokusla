# XcodeGen spesifikasyonu. `.xcodeproj` ÜRETİLİR ve git'e girmez:
#   cd ios && xcodegen generate
name: Fokus
options:
  bundleIdPrefix: com.musabustun
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: tr
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Fokus.xcconfig
  Release: Config/Fokus.xcconfig
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  FokusKit:
    path: FokusKit
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
targets:
  Fokus:
    type: application
    platform: iOS
    sources:
      - path: Fokus
      - path: Shared
      - path: WatchLink
    dependencies:
      - package: FokusKit
        products: [FokusDomain, FokusData, FokusDesign, FokusAudio]
      - package: SpotifyiOS
        product: SpotifyiOS
      - target: FokusWidgets
        embed: true
      - target: FokusWatch
        embed: true
      - target: FokusMessages
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Fokus/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fokus/Fokus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Palete göre alternatif ikonlar (FokusDesign `FokusAppIcon`; üretim: scripts/generate_palette_app_icons.py).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Mono AppIcon-Strawberry AppIcon-Matcha AppIcon-Blueberry AppIcon-Lemonade
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  # Widget'lar, Live Activity ve App Intents uzantısı. Bundle ID: com.musabustun.fokus.widgets
  # (yalnızca projede tanımlı; Apple Developer hesabında kaydedilmesi gerekir — bkz. ios/README.md).
  FokusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FokusWidgets
      - path: Shared
    dependencies:
      - package: FokusKit
        products: [FokusDomain, FokusData, FokusDesign]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musabustun.fokus.widgets
        INFOPLIST_FILE: FokusWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FokusWidgets/FokusWidgets.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  # Apple Watch uygulaması (watchOS 11+, telefondan bağımsız çalışır; iOS uygulamasına gömülü companion).
  # Bundle ID: com.musabustun.fokus.watchkitapp — yalnızca projede tanımlı; Apple Developer hesabında
  # kaydedilmesi gerekir (bkz. ios/README.md). FokusAudio/Spotify saate GİRMEZ.
  FokusWatch:
    type: application
    platform: watchOS
    sources:
      - path: FokusWatch
      - path: WatchLink
      - path: Shared
        includes: [FocusActions.swift, FokusSystemStore.swift]
    dependencies:
      - package: FokusKit
        products: [FokusDomain, FokusData, FokusDesign]
      - target: FokusWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musabustun.fokus.watchkitapp
        INFOPLIST_FILE: FokusWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: FokusWatch/FokusWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
  # Saat komplikasyonları / Smart Stack. Bundle ID: com.musabustun.fokus.watchkitapp.widgets
  FokusWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: FokusWatchWidgets
      - path: Shared
        includes: [FokusSystemStore.swift]
    dependencies:
      - package: FokusKit
        products: [FokusDomain, FokusData, FokusDesign]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musabustun.fokus.watchkitapp.widgets
        INFOPLIST_FILE: FokusWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FokusWatchWidgets/FokusWatchWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
  # iMessage uzantısı (Messages app extension): "bugün çalıştım" kartı + sunucusuz oda daveti.
  # Bundle ID: com.musabustun.fokus.messages (yalnızca projede tanımlı; Apple Developer hesabında
  # kaydedilmesi ve App Group'a eklenmesi gerekir — bkz. ios/README.md). Depoyu yalnızca OKUR.
  FokusMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: FokusMessages
      - path: Shared
        includes:
          - FokusSystemStore.swift
    dependencies:
      - package: FokusKit
        products: [FokusDomain, FokusData, FokusDesign]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musabustun.fokus.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        INFOPLIST_FILE: FokusMessages/Info.plist
        CODE_SIGN_ENTITLEMENTS: FokusMessages/FokusMessages.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  FokusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FokusUITests
    dependencies:
      - target: Fokus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.musabustun.fokus.uitests
        TEST_TARGET_NAME: Fokus
schemes:
  FokusWatch:
    build:
      targets:
        FokusWatch: all
    run:
      config: Debug
  Fokus:
    build:
      targets:
        Fokus: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: FokusKit/FokusDomainTests
        - package: FokusKit/FokusDataTests
        - package: FokusKit/FokusDesignTests
        - package: FokusKit/FokusAudioTests
        - name: FokusUITests
