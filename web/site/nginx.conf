# Fokus destek sitesi — nginx sunucu bloğu (Docker imajında /etc/nginx/conf.d/default.conf olur).
# Yalnızca statik dosya sunar; temiz URL'ler (/destek/), /healthz, güvenlik başlıkları, gzip, önbellek, özel 404.
#
# Not: Konumlarda `add_header` KULLANMA. nginx, bir konumda add_header varsa sunucu düzeyindekileri
# devralmaz; güvenlik başlıkları bu yüzden tek dosyada (security-headers.conf) ve yalnızca sunucu
# düzeyinde dahil edilir. Önbellek için `expires` kullan (devralmayı bozmaz).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Ziyaretçi IP adresleri tutulmaz.
    access_log off;
    # Yönlendirmeler göreli kalsın: TLS'i sonlandıran vekil (Coolify/Traefik) arkasında doğru çalışır.
    absolute_redirect off;

    include /etc/nginx/fokus-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml image/svg+xml image/x-icon font/ttf;

    error_page 404 /404.html;

    # Yalnızca okuma.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # /destek/index.html → /destek/ (özgün istek adresine bakılır; dahili index yönlendirmesiyle döngü olmaz).
    if ($request_uri ~ "^(.*)/index\.html(\?.*)?$") {
        return 301 $1/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
        expires -1;
    }

    # Gizli dosyalar (.git, .env …) asla sunulmaz.
    location ~ /\. {
        return 404;
    }

    # Yazı tipleri değişmez; stil dosyası sürümsüzdür, kısa tutulur.
    # `types` bu konumda tüm eşlemeyi değiştirir; altında yalnızca .ttf ve lisans .txt dosyaları var.
    location /assets/fonts/ {
        types {
            font/ttf ttf;
        }
        default_type text/plain;
        expires 30d;
    }

    location /assets/ {
        expires 1h;
    }

    location = /favicon.ico {
        expires 7d;
    }

    # HTML: her seferinde doğrulanır (Cache-Control: no-cache; ETag ile 304).
    # /destek → /destek/ (301) nginx'in dizin yönlendirmesiyle gelir.
    location / {
        expires -1;
    }
}
